<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>BharatCloud Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Manrope:wght@420;560;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14110e;
      --paper: #f6f1e8;
      --panel: #fffdf8;
      --line: #e4dacb;
      --saffron: #d85a1a;
      --saffron-deep: #9a3412;
      --forest: #1f6b4a;
      --warn: #9a3412;
      --muted: #6f655b;
      --shadow: 0 24px 60px rgba(40, 24, 8, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-width: 1100px;
      font-family: Manrope, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 8% -10%, rgba(216, 90, 26, 0.16), transparent 60%),
        linear-gradient(180deg, #fbf7f1 0%, var(--paper) 40%, #efe6d8 100%);
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3 { font-family: Fraunces, serif; font-weight: 560; letter-spacing: -0.03em; margin: 0; }

    #desktop-gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #1a120c;
      color: #f6f1e8;
      text-align: center;
    }
    #desktop-gate h1 { font-size: 42px; }
    #desktop-gate p { color: #d9cbbd; max-width: 420px; }

    @media (max-width: 1023px) {
      body { min-width: 0; overflow: hidden; }
      #app { display: none !important; }
      #desktop-gate { display: flex !important; }
    }

    .login {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
    }
    .brand-pane {
      padding: 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .mark {
      display: flex;
      gap: 14px;
      align-items: center;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 13px;
    }
    .mark i {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: #f6f1e8;
      font-style: normal;
      font-family: Fraunces, serif;
    }
    .brand-pane h1 { font-size: 68px; line-height: 0.92; max-width: 640px; margin-top: 48px; }
    .brand-pane h1 span { color: var(--saffron-deep); }
    .lede { max-width: 520px; font-size: 18px; line-height: 1.5; color: var(--muted); }
    .role-list { display: grid; gap: 12px; margin-top: 36px; max-width: 560px; }
    .role-list article {
      background: rgba(255, 253, 248, 0.72);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .role-list strong { display: block; margin-bottom: 4px; }
    .role-list span { color: var(--muted); font-size: 14px; }
    .form-pane { display: grid; place-items: center; padding: 40px; }
    .card {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 32px;
    }
    .card h2 { font-size: 36px; }
    .hint { color: var(--muted); margin: 8px 0 22px; line-height: 1.45; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
    input, textarea, select {
      width: 100%;
      margin-top: 6px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
    }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: #e0a27a; box-shadow: 0 0 0 4px rgba(216, 90, 26, 0.12); }
    .primary, .ghost, .danger {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
    }
    .primary { background: var(--ink); color: #f6f1e8; }
    .primary:disabled { opacity: 0.55; cursor: wait; }
    .ghost { background: #f3ece3; color: var(--ink); }
    .danger { background: #fde8df; color: var(--warn); }
    .full { width: 100%; }
    .banner {
      background: #fde8df;
      color: var(--warn);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .ok {
      background: #e7f6ee;
      color: var(--forest);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .shell { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
    .side {
      padding: 28px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.55);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .nav { display: grid; gap: 8px; }
    .nav button {
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 12px;
      padding: 12px 12px;
      font-weight: 700;
    }
    .nav button.active { background: var(--ink); color: #f6f1e8; }
    .who { margin-top: auto; font-size: 13px; color: var(--muted); }
    .who strong { color: var(--ink); display: block; font-size: 14px; }
    main { padding: 32px 36px 48px; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 22px; }
    .eyebrow { letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; font-weight: 700; color: var(--saffron-deep); }
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 18px; }
    .grid.payments { grid-template-columns: 340px 1fr; align-items: start; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
    }
    .panel + .panel { margin-top: 18px; }
    .meter { height: 14px; border-radius: 999px; background: #efe4d6; overflow: hidden; margin: 14px 0; }
    .meter span { display: block; height: 100%; width: 24.8%; background: linear-gradient(90deg, #d85a1a, #ef9a4a); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .pill { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
    .pill.paid { background: #e7f6ee; color: var(--forest); }
    .pill.pending { background: #fde8df; color: var(--warn); }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .split { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; }
    .files { display: grid; gap: 10px; }
    .file {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .share-line { display: flex; gap: 8px; margin-top: 8px; }
    .share-line input { margin: 0; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
    .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
    .kpi b { display: block; font-family: Fraunces, serif; font-size: 32px; margin-top: 6px; }
    .notice { font-size: 13px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div id="desktop-gate">
    <div>
      <h1>Open on a laptop</h1>
      <p>BharatCloud workspace is built for laptop and desktop screens. Phone and tablet layouts are turned off.</p>
    </div>
  </div>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js?v=3"></script>
</body>
</html>
